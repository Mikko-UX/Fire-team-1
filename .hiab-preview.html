<title>Hiab Configurator 2.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E9ECEF; --surface:#FFFFFF; --surface-2:#F4F6F8; --surface-3:#E7EBEE;
  --ink:#12171B; --ink-2:#5C6873; --ink-3:#8A959F;
  --line:#D2D9DE; --line-2:#BFC8CF;
  --accent:#C9241D; --accent-fill:#C9241D; --accent-soft:#FBECEA; --accent-line:#E8A9A4; --on-accent:#FFFFFF;
  --ok:#1C6B5F; --ok-soft:#E4F0ED; --ok-line:#A9CFC7;
  --warn:#9A5B00; --warn-soft:#FBF0DC; --warn-line:#E3C688;
  --data:#255C8A; --data-soft:#E6EEF5; --data-line:#A8C4DA;
  --hatch:#C3CCD3;
  --shadow:0 1px 2px rgba(18,23,27,.06), 0 10px 28px -14px rgba(18,23,27,.22);
  --shadow-pop:0 2px 4px rgba(18,23,27,.08), 0 18px 40px -16px rgba(18,23,27,.32);
  --r:3px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --disp:"Archivo","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#12161A; --surface:#1A1F24; --surface-2:#20262C; --surface-3:#262D34;
    --ink:#E7ECF0; --ink-2:#94A0AA; --ink-3:#6E7B86;
    --line:#2E363E; --line-2:#3B454E;
    --accent:#F0665C; --accent-fill:#C4372E; --accent-soft:#2E1C1A; --accent-line:#5E2E29; --on-accent:#FFFFFF;
    --ok:#5CB9A5; --ok-soft:#162926; --ok-line:#2C4A44;
    --warn:#DCA23A; --warn-soft:#2A2317; --warn-line:#4C3E1F;
    --data:#7FB0DE; --data-soft:#182430; --data-line:#2C4358;
    --hatch:#39424A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-pop:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#12161A; --surface:#1A1F24; --surface-2:#20262C; --surface-3:#262D34;
  --ink:#E7ECF0; --ink-2:#94A0AA; --ink-3:#6E7B86;
  --line:#2E363E; --line-2:#3B454E;
  --accent:#F0665C; --accent-fill:#C4372E; --accent-soft:#2E1C1A; --accent-line:#5E2E29; --on-accent:#FFFFFF;
  --ok:#5CB9A5; --ok-soft:#162926; --ok-line:#2C4A44;
  --warn:#DCA23A; --warn-soft:#2A2317; --warn-line:#4C3E1F;
  --data:#7FB0DE; --data-soft:#182430; --data-line:#2C4358;
  --hatch:#39424A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
  --shadow-pop:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:64px}
h1,h2,h3,h4{margin:0;font-family:var(--disp);text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- eyebrow / label ---------- */
.eyebrow{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:0 18px;height:52px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.brand .mark{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--accent)}
.brand .prod{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.01em}
.brand .ver{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-bottom:1px}
.topbar .sep{width:1px;height:24px;background:var(--line);flex:0 0 auto}
.topmeta{display:flex;align-items:center;gap:16px;flex:1 1 auto;min-width:0;overflow:hidden}
.kv{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv .k{font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.kv .v{font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topact{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.demotag{font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);padding:3px 7px;border-radius:2px}

/* ---------- controls ---------- */
.btn{font-family:var(--disp);font-size:12px;font-weight:600;padding:6px 11px;border:1px solid var(--line-2);
  border-radius:var(--r);background:var(--surface);color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{font-size:11px;padding:4px 8px}
select.ctl{font-family:var(--mono);font-size:11.5px;padding:5px 8px;border:1px solid var(--line-2);
  border-radius:var(--r);background:var(--surface);color:var(--ink)}

/* ---------- telemetry strip ---------- */
.telemetry{position:sticky;top:52px;z-index:55;background:var(--surface-2);border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;gap:0;overflow-x:auto;scrollbar-width:thin}
.tcell{padding:8px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;flex:0 0 auto;min-width:96px}
.tcell .t-k{font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.tcell .t-v{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;line-height:1.15}
.tcell .t-v small{font-size:10px;color:var(--ink-3);font-weight:400}
.tcell.state{margin-left:auto;border-right:0;justify-content:center;min-width:0}
.statechip{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-size:11.5px;font-weight:600;
  padding:5px 10px;border-radius:2px;white-space:nowrap}
.statechip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.statechip.ok{color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-line)}
.statechip.ok .dot{background:var(--ok)}
.statechip.cyc{color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line)}
.statechip.cyc .dot{background:var(--warn);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.statechip.cyc .dot{animation:none}}
.flash{animation:flashbg .5s ease-out}
@keyframes flashbg{0%{background:var(--data-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 404px;gap:18px;
  max-width:1680px;margin:0 auto;padding:18px}
@media (max-width:1300px){.shell{grid-template-columns:210px minmax(0,1fr);}
  .inspector{grid-column:1 / -1}}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);padding:12px;gap:12px}}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 12px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* ---------- left rail ---------- */
.rail{position:sticky;top:104px;align-self:start;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 122px);overflow-y:auto;scrollbar-width:thin}
@media (max-width:900px){.rail{position:static;max-height:none}}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--line);width:100%;position:relative;transition:background .12s}
.step:last-child{border-bottom:0}
.step:hover{background:var(--surface-2)}
.step.on{background:var(--accent-soft)}
.step.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.step .num{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding-top:2px}
.step.on .num{color:var(--accent)}
.step .nm{display:block;font-family:var(--disp);font-size:12.5px;font-weight:600;line-height:1.25}
.step .sub{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
.step .sub b{color:var(--warn);font-weight:500}
.step.oos .nm{color:var(--ink-3)}

.railsec{padding:11px 12px;border-top:1px solid var(--line)}
.railsec:first-child{border-top:0}
.railsec > .eyebrow{display:block;margin-bottom:8px}
.radios{display:flex;flex-direction:column;gap:1px}
.radio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;text-align:left;
  padding:6px 7px;border-radius:var(--r);width:100%;transition:background .12s}
.radio:hover{background:var(--surface-2)}
.radio.on{background:var(--surface-3)}
.radio .box{width:11px;height:11px;border:1px solid var(--line-2);border-radius:50%;margin-top:4px;flex:0 0 auto}
.radio.on .box{border-color:var(--accent);border-width:3px;background:var(--surface)}
.radio .lbl{display:block;font-family:var(--disp);font-size:12px;font-weight:600}
.radio .d{display:block;font-size:11px;color:var(--ink-2);line-height:1.35;margin-top:1px}
.railrow{display:flex;gap:6px;flex-wrap:wrap}
.notecard{font-size:11.5px;color:var(--ink-2);line-height:1.45}
.notecard b{font-weight:600;color:var(--ink)}
details.help{margin-top:8px}
details.help summary{font-family:var(--disp);font-size:11px;font-weight:600;color:var(--data);cursor:pointer;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:"+ ";font-family:var(--mono)}
details.help[open] summary::before{content:"– "}
details.help .body{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-top:7px;display:flex;flex-direction:column;gap:6px}
</style>
<style>
/* ---------- centre column ---------- */
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.structhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.structhead h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
.structhead .sh-sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.structhead .sh-sub code{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{position:relative;padding:9px 14px 10px;font-family:var(--disp);font-size:12.5px;font-weight:600;
  color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:6px}
.tab .warnpip{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}

.scopenote{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;background:var(--data-soft);
  border:1px solid var(--data-line);border-radius:var(--r);font-size:12px;color:var(--ink-2);line-height:1.45}
.scopenote .ic{font-family:var(--mono);font-weight:500;color:var(--data);flex:0 0 auto}
.scopenote b{color:var(--ink);font-weight:600}

/* ---------- field ---------- */
.field{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative}
.field + .field{margin-top:10px}
.field-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:10px 12px 9px}
.field-h .fname{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.005em}
.field-h .fid{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);background:var(--surface-2);
  border:1px solid var(--line);padding:1px 5px;border-radius:2px}
.field-h .fgov{font-family:var(--mono);font-size:10.5px;color:var(--data)}
.field-h .fsel{margin-left:auto;font-size:12px;color:var(--ink-2);text-align:right}
.field-h .fsel b{color:var(--ink);font-weight:600}
.field-b{padding:0 12px 12px}
.field.oosf{opacity:.55}

/* option grids */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.cards.spec{grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.opt{position:relative;text-align:left;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--surface);padding:9px 10px;display:flex;flex-direction:column;gap:5px;
  transition:border-color .12s,background .12s,box-shadow .12s}
.opt:hover{border-color:var(--ink-3)}
.opt .on-name{font-family:var(--disp);font-size:12.5px;font-weight:600;line-height:1.3}
.opt .on-id{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.01em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .on-id{color:var(--accent)}
.opt.blk{border-color:var(--line);color:var(--ink-3);cursor:help;
  background-image:repeating-linear-gradient(45deg,transparent 0 5px,var(--hatch) 5px 6px)}
.opt.blk:hover{border-color:var(--warn)}
.opt.blk .on-name{color:var(--ink-2)}
.opt.blk.probe{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.opt .flags{display:flex;gap:5px;align-items:center;margin-top:1px}
.chip{font-family:var(--disp);font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:1.5px 5px;border-radius:2px;border:1px solid var(--line);color:var(--ink-3);background:var(--surface-2)}
.chip.s{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.chip.blkc{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.spectab{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;margin-top:4px;
  border-top:1px solid var(--line);padding-top:6px}
.spectab .sk{font-size:10.5px;color:var(--ink-3)}
.spectab .sv{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.opt.sel .spectab{border-top-color:var(--accent-line)}
.opt.sel .spectab .sv{color:var(--ink)}

/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;gap:0;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.segb{position:relative;padding:7px 12px;font-family:var(--disp);font-size:12px;font-weight:600;
  border-right:1px solid var(--line-2);transition:background .12s}
.segb:last-child{border-right:0}
.segb:hover{background:var(--surface-2)}
.segb.sel{background:var(--accent-fill);color:var(--on-accent)}
.segb.blk{color:var(--ink-3);background-image:repeating-linear-gradient(45deg,transparent 0 5px,var(--hatch) 5px 6px)}
.segb.blk.probe{box-shadow:inset 0 0 0 2px var(--warn)}
.segb .sid{font-family:var(--mono);font-size:9.5px;opacity:.62;margin-left:6px}

/* dropdown */
.dd{position:relative;max-width:520px}
.ddbtn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line-2);
  border-radius:var(--r);background:var(--surface);text-align:left;transition:border-color .12s}
.ddbtn:hover{border-color:var(--ink-3)}
.ddbtn.open{border-color:var(--accent)}
.ddbtn .dlab{font-size:13px;font-weight:500;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddbtn .did{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ddbtn .car{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.ddpop{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:40;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow-pop);
  max-height:272px;overflow-y:auto;padding:3px;scrollbar-width:thin}
.ddi{width:100%;display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:2px;text-align:left;transition:background .1s}
.ddi:hover{background:var(--surface-2)}
.ddi .dnm{font-size:12.5px;flex:1 1 auto;min-width:0}
.ddi .dcid{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ddi.sel{background:var(--accent-soft);font-weight:600}
.ddi.blk{color:var(--ink-3);background-image:repeating-linear-gradient(45deg,transparent 0 5px,var(--hatch) 5px 6px)}
.ddi.blk .dnm{color:var(--ink-2)}

/* ---------- blocked explain ---------- */
.explain{margin:0 12px 12px;border:1px solid var(--warn-line);border-radius:var(--r);background:var(--warn-soft)}
.explain-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--warn-line)}
.explain-h .ex-t{font-family:var(--disp);font-size:12.5px;font-weight:600}
.explain-h .ex-r{font-family:var(--mono);font-size:10.5px;color:var(--warn)}
.explain-h .ex-x{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3);padding:0 3px}
.conds{display:flex;flex-direction:column;gap:0;padding:2px 0}
.cond{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;padding:7px 11px;align-items:start}
.cond + .cond{border-top:1px solid var(--warn-line)}
.cond .cmark{font-family:var(--mono);font-size:11px;font-weight:500;padding-top:1px}
.cond.met .cmark{color:var(--ok)}
.cond.unmet .cmark{color:var(--warn)}
.cond .ctext{font-size:12.5px;line-height:1.4}
.cond .ctext b{font-weight:600}
.cond .craw{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}
.cond .cwarn{font-size:11.5px;color:var(--warn);margin-top:3px}
.explain-f{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 11px;border-top:1px solid var(--warn-line)}
.explain-f .fnote{font-size:11.5px;color:var(--ink-2)}

/* ---------- inspector ---------- */
.inspector{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 122px);display:flex;flex-direction:column}
@media (max-width:1300px){.inspector{position:static;max-height:none}}
.itabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.itab{flex:1 1 0;padding:9px 4px;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.itab:hover{color:var(--ink)}
.itab.on{color:var(--ink);border-bottom-color:var(--data)}
.itab .n{font-family:var(--mono);font-size:9.5px;letter-spacing:0;color:var(--ink-3);margin-left:4px}
.ibody{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
@media (min-width:1301px){.ibody{max-height:calc(100vh - 168px)}}
@media (max-width:1300px){.ibody{max-height:520px}}
.isec > .eyebrow{display:block;margin-bottom:7px}
.isec + .isec{border-top:1px solid var(--line);padding-top:13px}

.deflist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px}
.deflist .dt{font-size:12px;color:var(--ink-2);padding:4px 0;border-bottom:1px solid var(--line);min-width:0}
.deflist .dd{font-family:var(--mono);font-size:11.5px;text-align:right;padding:4px 0;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}

<script>
/* ==========================================================================
   RULE ENGINE  —  pure functions over parsed rule rows. No dependencies.
   Condition grammar:  [LHS]..[Operator][Value]
     LHS    FamilyID | attribute name | computed field
     Op     ==   <>   >=   <=   ~=
     Value  ComponentID (pipe-delimited alternatives) | Blank | number
            | --ComputedField (cross-field comparison) | attribute name (~=)
   ========================================================================== */

const COND_RE = /^(.+?)\.\.(==|<>|>=|<=|~=)(.*)$/;
const parseCache = new Map();
function parseCond(raw){
  let p = parseCache.get(raw);
  if(!p){
    const m = COND_RE.exec(raw);
    p = m ? {lhs:m[1],op:m[2],rhs:m[3],raw} : {lhs:raw,op:'==',rhs:'',raw,bad:true};
    parseCache.set(raw,p);
  }
  return p;
}

/* Resolve the left-hand side. `candidate` is the impact component being
   tested, which is how an attribute condition on the candidate resolves. */
function resolveLhs(lhs, ctx, candidate){
  if(FAMILIES[lhs]){
    const cid = ctx.selection[lhs];
    return {kind:'family', family:lhs, cid: cid || null, value: cid || 'Blank',
            num: cid && COMPONENTS[cid].attrs ? COMPONENTS[cid].attrs.num : undefined,
            set: cid && COMPONENTS[cid].attrs ? COMPONENTS[cid].attrs : undefined};
  }
  if(COMPUTED[lhs]) return {kind:'computed', field:lhs, value:ctx.computed[lhs], num:ctx.computed[lhs]};
  const ca = candidate && COMPONENTS[candidate] && COMPONENTS[candidate].attrs;
  if(ca && lhs in ca) return {kind:'attr', attr:lhs, from:candidate, onCandidate:true, value:ca[lhs], num:Number(ca[lhs])};
  for(const cid of Object.values(ctx.selection)){
    const a = COMPONENTS[cid] && COMPONENTS[cid].attrs;
    if(a && lhs in a) return {kind:'attr', attr:lhs, from:cid, value:a[lhs], num:Number(a[lhs])};
  }
  return {kind:'unresolved', value:undefined};
}

function resolveRhsNum(rhs, ctx){
  if(rhs.startsWith('--')){
    const f = rhs.slice(2);
    return {num: ctx.computed[f], field:f};
  }
  return {num: Number(rhs)};
}

function evalCond(raw, ctx, candidate){
  const p = parseCond(raw);
  const L = resolveLhs(p.lhs, ctx, candidate);
  if(p.op==='==' || p.op==='<>'){
    const alts = p.rhs.split('|');
    let hit;
    if(p.rhs==='Blank') hit = (L.value==='Blank' || L.value===undefined || L.value===null);
    else hit = alts.some(a=>String(L.value)===a);
    return p.op==='==' ? hit : !hit;
  }
  if(p.op==='>=' || p.op==='<='){
    const R = resolveRhsNum(p.rhs, ctx);
    if(!Number.isFinite(L.num) || !Number.isFinite(R.num)) return false;
    return p.op==='>=' ? L.num >= R.num : L.num <= R.num;
  }
  if(p.op==='~='){
    /* shared-attribute matching: candidate's attribute set must intersect
       the same attribute set on the family's selected component */
    const key = p.rhs;
    const mine = candidate && COMPONENTS[candidate].attrs && COMPONENTS[candidate].attrs[key];
    const theirs = L.set && L.set[key];
    if(!mine || !theirs) return false;
    const a = [].concat(mine), b = [].concat(theirs);
    return a.some(v=>b.includes(v));
  }
  return false;
}

/* ---- Model publication: total → scoped solution space ------------------- */
function inMarket(cid, market){
  const m = COMPONENTS[cid].markets;
  return !m || m.includes(market);
}
function publishedComponents(market){
  return Object.keys(COMPONENTS).filter(cid=>inMarket(cid,market));
}

/* Indexes, built once. */
const RULES_BY_TARGET = {};
function indexRules(rules){
  const ix = {};
  for(const r of rules){
    const k = r.t.k + ':' + r.t.id;
    (ix[k] = ix[k] || []).push(r);
  }
  return ix;
}
const COMPONENTS_BY_FAMILY = {};
for(const [cid,c] of Object.entries(COMPONENTS)){
  (COMPONENTS_BY_FAMILY[c.f] = COMPONENTS_BY_FAMILY[c.f] || []).push(cid);
}
for(const f in COMPONENTS_BY_FAMILY) COMPONENTS_BY_FAMILY[f].sort((a,b)=>COMPONENTS[a].s-COMPONENTS[b].s);
const FAMILIES_BY_GROUP = {};
for(const [fid,f] of Object.entries(FAMILIES)){
  (FAMILIES_BY_GROUP[f.group] = FAMILIES_BY_GROUP[f.group] || []).push(fid);
}
for(const g in FAMILIES_BY_GROUP) FAMILIES_BY_GROUP[g].sort((a,b)=>FAMILIES[a].sort-FAMILIES[b].sort);

function defaultOf(family){
  const list = COMPONENTS_BY_FAMILY[family] || [];
  const s = list.filter(c=>COMPONENTS[c].so==='S');
  if(s.length) return s[s.length-1];      /* highest sort index among S rows */
  return list[list.length-1] || null;
}

/* ---- The cascade -------------------------------------------------------- */
function evaluate(market, seedSelection, useCyclic){
  const t0 = performance.now();
  const rules = useCyclic ? SALES_RULES.concat(CYCLIC_RULES) : SALES_RULES;
  const ix = indexRules(rules);
  const scoped = publishedComponents(market);
  const scopedSet = new Set(scoped);

  let selection = Object.assign({}, seedSelection);
  const passes = [];
  const matchHistory = new Map();
  rules.forEach(r=>matchHistory.set(r.id, []));

  let prevSig = null, stable = false, ruleEvals = 0;
  let avail = new Set(), groupOk = {}, familyOk = {}, snapshots = [];

  for(let p=1; p<=MAX_PASSES; p++){
    const ctx = {selection, computed:computeFields(selection), market};
    const prevAvail = avail;
    const fired = [];

    /* 1. group scope */
    groupOk = {};
    for(const g in GROUPS){
      const rows = ix['group:'+g];
      if(!rows){ groupOk[g] = true; continue; }
      let ok = false;
      for(const r of rows){ ruleEvals++; const m = r.c.every(c=>evalCond(c,ctx,null)); if(m){ok=true;fired.push(r);} }
      groupOk[g] = ok;
    }
    /* 2. family scope */
    familyOk = {};
    for(const f in FAMILIES){
      if(!groupOk[FAMILIES[f].group]){ familyOk[f] = false; continue; }
      const rows = ix['family:'+f];
      if(!rows){ familyOk[f] = true; continue; }
      let ok = false;
      for(const r of rows){ ruleEvals++; const m = r.c.every(c=>evalCond(c,ctx,null)); if(m){ok=true;fired.push(r);} }
      familyOk[f] = ok;
    }
    /* 3. component availability */
    avail = new Set();
    for(const cid of scoped){
      const fam = COMPONENTS[cid].f;
      if(!familyOk[fam]) continue;
      const rows = ix['component:'+cid];
      if(!rows){ avail.add(cid); continue; }
      let ok = false;
      for(const r of rows){ ruleEvals++; const m = r.c.every(c=>evalCond(c,ctx,cid)); if(m){ok=true;fired.push(r);} }
      if(ok) avail.add(cid);
    }
    /* record which rules matched this pass, for cycle attribution */
    const firedIds = new Set(fired.map(r=>r.id));
    rules.forEach(r=>matchHistory.get(r.id).push(firedIds.has(r.id)));

    /* 4. repair selections */
    const repairs = [];
    const next = Object.assign({}, selection);
    for(const f in FAMILIES){
      if(!familyOk[f]){ if(next[f]!==undefined){ repairs.push({family:f, from:next[f], to:null, why:'out of scope'}); delete next[f]; } continue; }
      const cur = next[f];
      if(cur && avail.has(cur)) continue;
      const def = defaultOf(f);
      const pick = (def && avail.has(def)) ? def
                 : (COMPONENTS_BY_FAMILY[f]||[]).find(c=>avail.has(c)) || null;
      if(cur !== pick){
        repairs.push({family:f, from:cur||null, to:pick, why: cur ? 'no longer available' : 'seeded default'});
        if(pick) next[f] = pick; else delete next[f];
      }
    }
    selection = next;

    const added = [...avail].filter(c=>!prevAvail.has(c));
    const removed = [...prevAvail].filter(c=>!avail.has(c));
    passes.push({n:p, fired:[...firedIds], repairs, added, removed, availableCount:avail.size});
    snapshots.push({avail:new Set(avail), selection:Object.assign({},selection), groupOk:Object.assign({},groupOk), familyOk:Object.assign({},familyOk)});

    const sig = [...avail].sort().join(',') + '||' + Object.keys(selection).sort().map(k=>k+'='+selection[k]).join(',');
    if(sig === prevSig){ stable = true; break; }
    prevSig = sig;
  }

  /* cycle attribution: rules whose match result flipped more than once */
  let culprits = [];
  if(!stable){
    for(const [rid,hist] of matchHistory){
      let flips = 0;
      for(let i=1;i<hist.length;i++) if(hist[i]!==hist[i-1]) flips++;
      if(flips >= 2) culprits.push(rid);
    }
  }

  const ms = performance.now() - t0;
  const computed = computeFields(selection);
  return {
    market, selection, avail, groupOk, familyOk, scopedSet,
    totalComponents:Object.keys(COMPONENTS).length, scopedCount:scoped.length,
    passes, snapshots, stable, culprits, ruleEvals, ms, computed, rules, ix,
    ctx:{selection, computed, market}
  };
}

function computeFields(sel){
  const out = {};
  for(const k in COMPUTED) out[k] = COMPUTED[k].fn(sel);
  return out;
}

/* ---- Blocked-option reasoning ------------------------------------------ */
function blockInfo(cid, ev){
  const fam = COMPONENTS[cid].f, grp = FAMILIES[fam].group;
  if(!ev.scopedSet.has(cid)){
    return {kind:'market', text:'Not published in this market',
            detail:'The market matrix publishes '+cid+' for '+(COMPONENTS[cid].markets||[]).join(', ')+' only.'};
  }
  if(!ev.groupOk[grp]){
    const rows = ev.ix['group:'+grp] || [];
    return {kind:'scope', rule:rows[0], conds:condStates(rows[0], ev, null),
            text:'Family group '+GROUPS[grp].name+' is out of the scoped solution space'};
  }
  if(!ev.familyOk[fam]){
    const rows = ev.ix['family:'+fam] || [];
    return {kind:'scope', rule:rows[0], conds:condStates(rows[0], ev, null),
            text:'Family '+FAMILIES[fam].name+' is out of the scoped solution space'};
  }
  const rows = ev.ix['component:'+cid] || [];
  let best = null;
  for(const r of rows){
    const cs = condStates(r, ev, cid);
    const unmet = cs.filter(c=>!c.met).length;
    if(!best || unmet < best.unmet) best = {rule:r, conds:cs, unmet, total:cs.length};
  }
  if(!best) return {kind:'unknown', text:'No governing rule found'};
  return Object.assign({kind:'rule'}, best);
}

function condStates(rule, ev, candidate){
  if(!rule) return [];
  return rule.c.map(raw=>{
    const met = evalCond(raw, ev.ctx, candidate);
    return Object.assign({raw, met}, describeCond(raw, ev, candidate));
  });
}

/* Plain-language rendering of a condition, plus a machine-applicable fix. */
function describeCond(raw, ev, candidate){
  const p = parseCond(raw);
  const fam = FAMILIES[p.lhs];
  const cur = fam ? ev.selection[p.lhs] : null;
  const curName = cur ? COMPONENTS[cur].n : 'nothing selected';

  if(fam && (p.op==='=='||p.op==='<>')){
    const alts = p.rhs.split('|');
    if(p.rhs==='Blank'){
      return {text:'<b>'+fam.name+'</b> must have '+(p.op==='=='?'no selection':'a selection'),
              now:curName, fix:null};
    }
    const names = alts.filter(a=>COMPONENTS[a]).map(a=>COMPONENTS[a].n);
    if(p.op==='=='){
      const target = alts.find(a=>ev.avail.has(a)) || alts[0];
      return {text:'<b>'+fam.name+'</b> must be '+names.join(' or '),
              now:curName,
              fix:{family:p.lhs, to:target, blockedTarget:!ev.avail.has(target)}};
    }
    const alt = (COMPONENTS_BY_FAMILY[p.lhs]||[]).find(c=>!alts.includes(c) && ev.avail.has(c));
    return {text:'<b>'+fam.name+'</b> must not be '+names.join(' or '),
            now:curName, fix: alt ? {family:p.lhs, to:alt} : null};
  }
  if(fam && (p.op==='>='||p.op==='<=')){
    const R = resolveRhsNum(p.rhs, ev.ctx);
    const nowNum = cur && COMPONENTS[cur].attrs ? COMPONENTS[cur].attrs.num : undefined;
    const target = (COMPONENTS_BY_FAMILY[p.lhs]||[]).find(c=>{
      const n = COMPONENTS[c].attrs && COMPONENTS[c].attrs.num;
      return ev.avail.has(c) && Number.isFinite(n) && (p.op==='>=' ? n>=R.num : n<=R.num);
    });
    return {text:'<b>'+fam.name+'</b> must be '+(p.op==='>='?'at least':'at most')+' '+fmtNum(R.num),
            now:curName+(Number.isFinite(nowNum)?' ('+fmtNum(nowNum)+')':''),
            fix: target ? {family:p.lhs, to:target} : null};
  }
  if(COMPUTED[p.lhs]){
    const C = COMPUTED[p.lhs], R = resolveRhsNum(p.rhs, ev.ctx);
    return {text:'<b>'+C.label+'</b> must be '+(p.op==='>='?'at least':'at most')+' '+fmtNum(R.num)+' '+C.unit,
            now:fmtNum(ev.computed[p.lhs])+' '+C.unit, fix:null,
            note:'Computed field · '+C.formula};
  }
  if(p.op==='~='){
    const other = FAMILIES[p.lhs];
    const mine = candidate && COMPONENTS[candidate].attrs && COMPONENTS[candidate].attrs[p.rhs];
    const theirs = cur && COMPONENTS[cur].attrs && COMPONENTS[cur].attrs[p.rhs];
    return {text:'Must share a <b>'+p.rhs.toLowerCase()+'</b> class with the selected '+(other?other.name.toLowerCase():p.lhs),
            now:(theirs?[].concat(theirs).join(', '):'—')+' on '+curName+
                ' vs '+(mine?[].concat(mine).join(', '):'—')+' on this option',
            fix:null, note:'Shared-attribute matching'};
  }
  /* attribute condition */
  const R = (p.op==='>='||p.op==='<=') ? resolveRhsNum(p.rhs, ev.ctx) : null;
  const L = resolveLhs(p.lhs, ev.ctx, candidate);
  const rhsLabel = R
    ? (R.field ? COMPUTED[R.field].label.toLowerCase()+' ('+fmtNum(R.num)+' '+COMPUTED[R.field].unit+')' : fmtNum(R.num))
    : p.rhs;
  return {text:'<b>'+p.lhs+'</b> must be '+(p.op==='>='?'at least ':p.op==='<='?'at most ':p.op==='<>'?'other than ':'')+rhsLabel,
          now: L.value===undefined ? 'unresolved' : String(L.value)+(L.onCandidate?' (this option)':L.from?' (from '+L.from+')':''),
          fix:null, note: L.onCandidate ? 'Attribute of the candidate option' : 'Attribute of a selected option'};
}

function fmtNum(n){
  if(!Number.isFinite(n)) return '—';
  return (Math.round(n*10)/10).toLocaleString('en-GB');
}

/* ---- MBOM: single pass over production rules --------------------------- */
function buildMbom(ev){
  const ctx = ev.ctx;
  const byCode = new Map();
  let evals = 0;
  for(const r of PROD_RULES){
    evals++;
    if(!r.c.every(c=>evalCond(c, ctx, null))) continue;
    let row = byCode.get(r.code);
    if(!row){ row = {code:r.code, n:r.n, q:0, from:[]}; byCode.set(r.code, row); }
    row.q += r.q;
    row.from.push(r.id+' ×'+r.q);
  }
  const rows = [...byCode.values()].sort((a,b)=>a.code.localeCompare(b.code));
  const items = rows.reduce((s,r)=>s+r.q,0);
  return {rows, items, evals};
}

/* ---- SBOM ------------------------------------------------------------- */
function buildSbom(ev){
  const out = [];
  for(const st of STRUCTURES){
    const lines = [];
    for(const g of st.groups){
      if(!ev.groupOk[g]) continue;
      for(const f of FAMILIES_BY_GROUP[g]||[]){
        if(!ev.familyOk[f]) continue;
        const cid = ev.selection[f];
        if(!cid) continue;
        lines.push({family:f, familyName:FAMILIES[f].name, cid, name:COMPONENTS[cid].n});
      }
    }
    out.push({structure:st, lines});
  }
  return out;
}
</script>
<script>
/* ==========================================================================
   APPLICATION STATE + RENDERING
   ========================================================================== */
const LSKEY = 'hiab-cfg-2-demo';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const state = {
  configId: null,
  market: 'EU',
  selection: {},
  structure: 'LC',
  group: 'FG1',
  itab: 'solution',
  policy: 'disable',          /* hide | disable | explain */
  probe: null,                /* ComponentID whose block reason is open */
  cyclic: false,
  stepMode: false,
  stepPass: 1,
  openDd: null,
  ruleFilter: '',
  savedAt: null
};
let ev = null, mbom = null, sbom = null;

function newId(){
  try{ return crypto.randomUUID(); }
  catch(e){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }); }
}

function load(){
  try{
    const raw = localStorage.getItem(LSKEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.ConfigurationID){
        state.configId = d.ConfigurationID;
        state.market = MARKETS.some(m=>m.id===d.MarketID) ? d.MarketID : 'EU';
        state.selection = d.Selection || {};
        if(d.Policy) state.policy = d.Policy;
        return;
      }
    }
  }catch(e){/* private mode, blocked storage — start fresh */}
  state.configId = newId();
}
function save(){
  state.savedAt = new Date();
  try{
    localStorage.setItem(LSKEY, JSON.stringify(jsonbDoc()));
  }catch(e){/* non-fatal */}
}
function jsonbDoc(){
  return {
    ConfigurationID: state.configId,
    ModelID: MODEL,
    MarketID: state.market,
    Policy: state.policy,
    Selection: ev ? ev.selection : state.selection,
    Sbom: sbom ? sbom.flatMap(s=>s.lines.map(l=>l.cid)) : [],
    Mbom: mbom ? mbom.rows.map(r=>({MaterialID:r.code, Qty:r.q})) : [],
    UpdatedAt: new Date().toISOString()
  };
}

/* ---- run the engine ---------------------------------------------------- */
function run(opts){
  opts = opts || {};
  const before = ev ? Object.assign({}, ev.selection) : null;
  ev = evaluate(state.market, state.selection, state.cyclic);
  state.selection = Object.assign({}, ev.selection);
  mbom = buildMbom(ev);
  sbom = buildSbom(ev);
  if(!state.stepMode) state.stepPass = ev.passes.length;
  save();

  if(before && opts.announceRepairs){
    const reps = [];
    for(const f in FAMILIES){
      const a = before[f], b = ev.selection[f];
      if(a && a!==b && f!==opts.changedFamily){
        reps.push({f, from:a, to:b});
      }
    }
    reps.slice(0,3).forEach(r=>{
      toast(FAMILIES[r.f].name + (r.to ? ' reset' : ' cleared'),
        r.to ? '<code>'+esc(COMPONENTS[r.from].n)+'</code> is no longer available. Set to <code>'+esc(COMPONENTS[r.to].n)+'</code>.'
             : '<code>'+esc(COMPONENTS[r.from].n)+'</code> dropped — the family left the scoped solution space.',
        'warn');
    });
    if(reps.length>3) toast('Cascade repaired '+reps.length+' selections','Open the Trace tab to step through the passes.','warn');
  }
  if(!ev.stable && opts.announceRepairs){
    toast('Cascade did not stabilise', 'Stopped after '+MAX_PASSES+' passes. Suspect rules: <code>'+ev.culprits.join(', ')+'</code>.', 'warn');
  }
  render();
}

let toastSeq = 0;
function toast(title, body, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='warn' ? ' warn' : '');
  el.innerHTML = '<div class="tt">'+esc(title)+'</div><div class="tb">'+body+'</div>';
  $('toasts').appendChild(el);
  const id = ++toastSeq;
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, 7000 + id*0);
}

/* view = the pass snapshot currently displayed (step mode) */
function view(){
  if(state.stepMode){
    const i = Math.min(state.stepPass, ev.snapshots.length) - 1;
    const s = ev.snapshots[Math.max(0,i)];
    return {avail:s.avail, selection:s.selection, groupOk:s.groupOk, familyOk:s.familyOk, live:false};
  }
  return {avail:ev.avail, selection:ev.selection, groupOk:ev.groupOk, familyOk:ev.familyOk, live:true};
}

/* ==========================  TELEMETRY  ================================= */
function renderTelemetry(){
  const passes = ev.passes.length;
  const inScope = [...ev.scopedSet].filter(c=>ev.familyOk[COMPONENTS[c].f]).length;
  const blocked = inScope - [...ev.avail].length;
  const cells = [
    ['Passes', passes + (ev.stable?'':'<small> / cap</small>')],
    ['Rule evaluations', ev.ruleEvals.toLocaleString('en-GB')],
    ['Evaluation', ev.ms.toFixed(1)+'<small> ms</small>'],
    ['Solution space', ev.scopedCount+'<small> / '+ev.totalComponents+'</small>'],
    ['Available', ev.avail.size],
    ['Blocked', blocked],
    ['MBOM lines', mbom.rows.length+'<small> · '+mbom.items+' items</small>']
  ];
  $('telemetry').innerHTML =
    cells.map(([k,v])=>'<div class="tcell"><span class="t-k">'+k+'</span><span class="t-v">'+v+'</span></div>').join('') +
    '<div class="tcell state">' + (ev.stable
      ? '<span class="statechip ok"><span class="dot"></span>Stabilised in '+passes+' pass'+(passes>1?'es':'')+'</span>'
      : '<span class="statechip cyc"><span class="dot"></span>Not stabilised — probable rule cycle</span>') +
    '</div>';
  $('telemetry').classList.remove('flash');
  void $('telemetry').offsetWidth;
  $('telemetry').classList.add('flash');
}

/* ==========================  LEFT RAIL  ================================= */
function renderRail(){
  const v = view();
  $('steps').innerHTML = STRUCTURES.map((st,i)=>{
    const groups = st.groups.filter(g=>v.groupOk[g]);
    const fields = groups.flatMap(g=>(FAMILIES_BY_GROUP[g]||[]).filter(f=>v.familyOk[f]));
    const blocked = groups.flatMap(g=>(FAMILIES_BY_GROUP[g]||[]).filter(f=>v.familyOk[f]))
      .flatMap(f=>(COMPONENTS_BY_FAMILY[f]||[]).filter(c=>ev.scopedSet.has(c) && !v.avail.has(c))).length;
    const oosCount = st.groups.length - groups.length;
    return '<button class="step'+(state.structure===st.id?' on':'')+(groups.length?'':' oos')+'" data-struct="'+st.id+'">'+
      '<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+
      '<span><span class="nm">'+esc(st.name)+'</span>'+
      '<span class="sub">'+fields.length+' fields · <b>'+blocked+'</b> blocked'+
      (oosCount?' · '+oosCount+' group'+(oosCount>1?'s':'')+' out of scope':'')+'</span></span></button>';
  }).join('');

  const pol = [
    ['hide','Hide','Removed from the field — parity with today’s configurator.'],
    ['disable','Disable','Visible, hatched, not selectable. Unblock hint on click.'],
    ['explain','Explain','Selectable. Selecting surfaces the unmet conditions.']
  ];
  $('railctl').innerHTML =
    '<div class="railsec"><span class="eyebrow">Blocked options</span><div class="radios">'+
      pol.map(([k,l,d])=>'<button class="radio'+(state.policy===k?' on':'')+'" data-policy="'+k+'">'+
        '<span class="box"></span><span><span class="lbl">'+l+'</span><span class="d">'+esc(d)+'</span></span></button>').join('')+
    '</div></div>'+
    '<div class="railsec"><span class="eyebrow">Rule interpreter</span>'+
      '<div class="notecard" style="margin-bottom:8px">'+
        (state.stepMode
          ? 'Paused at pass <b>'+state.stepPass+' of '+ev.passes.length+'</b>. The configurator shows the solution space as it stood after that pass.'
          : 'Runs to stabilisation automatically. Step mode pauses the cascade so you can watch it settle.')+
      '</div>'+
      '<div class="railrow">'+
        (state.stepMode
          ? '<button class="btn sm" id="btn-prev"'+(state.stepPass<=1?' disabled':'')+'>◀ Prev</button>'+
            '<button class="btn sm" id="btn-next"'+(state.stepPass>=ev.passes.length?' disabled':'')+'>Next ▶</button>'+
            '<button class="btn sm primary" id="btn-resume">Resume</button>'
          : '<button class="btn sm" id="btn-step">Step through passes</button>')+
      '</div>'+
    '</div>'+
    '<div class="railsec"><span class="eyebrow">Rule lab</span>'+
      '<button class="radio'+(state.cyclic?' on':'')+'" data-cyclic="1" style="padding-left:0">'+
        '<span class="box"></span><span><span class="lbl">Inject cyclic rule pair</span>'+
        '<span class="d">Adds <code class="mono">R-LAB-901…905</code>, which make corrosion class and stabiliser legs each require the other family’s alternative. The cascade walks a four-state loop and never stabilises. Market EU.</span></span></button>'+
    '</div>';

  const nFam = Object.keys(FAMILIES).length, nComp = Object.keys(COMPONENTS).length;
  $('railabout').innerHTML =
    '<div class="railsec"><span class="eyebrow">About this demo</span>'+
      '<div class="notecard">Synthetic master data shaped like Hiab’s PFMP export: <b>'+STRUCTURES.length+'</b> structures, '+
      '<b>'+Object.keys(GROUPS).length+'</b> family groups, <b>'+nFam+'</b> families, <b>'+nComp+'</b> sales options, '+
      '<b>'+SALES_RULES.length+'</b> sales rules, <b>'+PROD_RULES.length+'</b> production rules. '+
      'No Hiab data was used.</div>'+
      '<details class="help"><summary>How to read this</summary><div class="body">'+
        '<span>The whole UI is generated from the data: <b>FamilyGroupID</b> → tabs, <b>FamilyID</b> → fields, '+
        '<b>ComponentID</b> → options, <b>UICode</b> → selector type. No per-model UI code.</span>'+
        '<span>Hatched options are <b>blocked</b> by a sales rule. Click one to see which conditions are unmet, and apply the fix.</span>'+
        '<span>Selections that a rule invalidates are repaired automatically — that is what drives the multi-pass cascade.</span>'+
        '<span>Try: set <b>Capacity class</b> to X-HiPro 302, then <b>Control system</b> to SPACE 5000, and watch the '+
        'Installation and Contracts structures open up. Or set <b>Installation scope</b> to "Chassis only" to take two whole family groups out of scope.</span>'+
      '</div></details>'+
    '</div>';
}
</script>
<script>
/* ==========================  CENTRE COLUMN  ============================= */
function renderMain(){
  const v = view();
  const st = STRUCTURES.find(s=>s.id===state.structure);
  const groups = st.groups.filter(g=>v.groupOk[g]);
  const oos = st.groups.filter(g=>!v.groupOk[g]);
  if(!groups.includes(state.group)) state.group = groups[0] || null;

  let html = '';

  html += '<div class="structhead"><div>'+
    '<span class="eyebrow">Structure '+(STRUCTURES.indexOf(st)+1)+' of '+STRUCTURES.length+'</span>'+
    '<h2>'+esc(st.name)+'</h2>'+
    '<div class="sh-sub">Model <code>'+MODEL+'</code> · market <code>'+state.market+'</code> · '+
      'upstream selections from earlier structures are evaluated as ordinary conditions</div>'+
    '</div></div>';

  if(state.stepMode){
    const p = ev.passes[state.stepPass-1];
    html += '<div class="stepbanner">'+
      '<span class="sb-t">Pass '+state.stepPass+' / '+ev.passes.length+'</span>'+
      '<span class="sb-d">'+p.fired.length+' rules fired · '+p.added.length+' options became available · '+
        p.removed.length+' withdrawn · '+p.repairs.length+' selections repaired. Read-only while paused.</span>'+
      '<span class="sb-a"><button class="btn sm" id="btn-prev2"'+(state.stepPass<=1?' disabled':'')+'>◀</button>'+
      '<button class="btn sm" id="btn-next2"'+(state.stepPass>=ev.passes.length?' disabled':'')+'>▶</button>'+
      '<button class="btn sm primary" id="btn-resume2">Resume</button></span></div>';
  }

  if(!ev.stable){
    html += '<div class="scopenote" style="background:var(--warn-soft);border-color:var(--warn-line)">'+
      '<span class="ic" style="color:var(--warn)">!</span><span>The cascade did not stabilise within '+MAX_PASSES+
      ' passes, so the rule structure probably contains a cycle. Rules whose outcome kept flipping: <b>'+
      esc(ev.culprits.join(', '))+'</b>. Open the <b>Trace</b> tab to see the oscillation pass by pass.</span></div>';
  }

  if(oos.length){
    const cause = oos.map(g=>{
      const rows = ev.ix['group:'+g] || [];
      const cs = condStates(rows[0], ev, null).filter(c=>!c.met);
      return cs.length ? cs[0].text.replace(/<\/?b>/g,'') : 'a scoping rule';
    })[0];
    html += '<div class="scopenote"><span class="ic">scope</span><span>'+
      '<b>'+oos.map(g=>GROUPS[g].name).join('</b> and <b>')+'</b> '+(oos.length>1?'are':'is')+
      ' out of the scoped solution space. Family-group-level rule requires: '+esc(cause)+'.</span></div>';
  }

  if(groups.length){
    html += '<div class="tabs">'+groups.map(g=>{
      const fams = (FAMILIES_BY_GROUP[g]||[]).filter(f=>v.familyOk[f]);
      const blk = fams.flatMap(f=>(COMPONENTS_BY_FAMILY[f]||[]).filter(c=>ev.scopedSet.has(c)&&!v.avail.has(c))).length;
      return '<button class="tab'+(state.group===g?' on':'')+'" data-group="'+g+'">'+esc(GROUPS[g].name)+
        '<span class="cnt">'+fams.length+'</span>'+(blk?'<span class="warnpip" title="'+blk+' blocked options"></span>':'')+'</button>';
    }).join('')+'</div>';

    html += '<div>'+(FAMILIES_BY_GROUP[state.group]||[])
      .filter(f=>v.familyOk[f]).map(f=>renderField(f, v)).join('')+'</div>';

    const hiddenFams = (FAMILIES_BY_GROUP[state.group]||[]).filter(f=>!v.familyOk[f]);
    if(hiddenFams.length){
      html += '<div class="scopenote" style="margin-top:10px"><span class="ic">scope</span><span>'+
        '<b>'+hiddenFams.map(f=>FAMILIES[f].name).join('</b>, <b>')+'</b> '+(hiddenFams.length>1?'are':'is')+
        ' out of scope here — a family-level rule withdrew '+(hiddenFams.length>1?'them':'it')+
        ' from the solution space.</span></div>';
    }
  }
  $('main').innerHTML = html;
}

function renderField(f, v){
  const fam = FAMILIES[f];
  const opts = (COMPONENTS_BY_FAMILY[f]||[]).filter(c=>ev.scopedSet.has(c));
  const sel = v.selection[f];
  const govCount = SALES_RULES.concat(state.cyclic?CYCLIC_RULES:[])
    .filter(r=>r.t.k==='component' && opts.includes(r.t.id)).length;

  let h = '<div class="field" data-field="'+f+'">'+
    '<div class="field-h">'+
      '<span class="fname">'+esc(fam.name)+'</span>'+
      '<span class="fid mono">'+f+'</span>'+
      (govCount?'<span class="fgov">'+govCount+' rule'+(govCount>1?'s':'')+'</span>':'')+
      '<span class="fsel">'+(sel?'<b>'+esc(COMPONENTS[sel].n)+'</b> <span class="mono" style="font-size:10.5px;color:var(--ink-3)">'+sel+'</span>':'<i>no selection</i>')+'</span>'+
    '</div><div class="field-b">';

  const shown = opts.filter(c=>state.policy!=='hide' || v.avail.has(c));
  if(!shown.length){
    h += '<div class="notecard">No option in this family is available with the current configuration.</div>';
  } else if(fam.ui==='segment'){
    h += '<div class="seg">'+shown.map(c=>{
      const blk = !v.avail.has(c);
      return '<button class="segb'+(sel===c?' sel':'')+(blk?' blk':'')+(state.probe===c?' probe':'')+
        '" data-opt="'+c+'" data-fam="'+f+'">'+esc(COMPONENTS[c].n)+'<span class="sid">'+c+'</span></button>';
    }).join('')+'</div>';
  } else if(fam.ui==='dropdown'){
    const open = state.openDd===f;
    h += '<div class="dd">'+
      '<button class="ddbtn'+(open?' open':'')+'" data-dd="'+f+'">'+
        '<span class="dlab">'+(sel?esc(COMPONENTS[sel].n):'Select…')+'</span>'+
        '<span class="did">'+(sel||'')+'</span><span class="car">'+(open?'▲':'▼')+'</span></button>'+
      (open ? '<div class="ddpop">'+shown.map(c=>{
        const blk = !v.avail.has(c);
        return '<button class="ddi'+(sel===c?' sel':'')+(blk?' blk':'')+'" data-opt="'+c+'" data-fam="'+f+'">'+
          '<span class="dnm">'+esc(COMPONENTS[c].n)+'</span>'+
          (COMPONENTS[c].so==='S'?'<span class="chip s">Default</span>':'')+
          (blk?'<span class="chip blkc">Blocked</span>':'')+
          '<span class="dcid">'+c+'</span></button>';
      }).join('')+'</div>' : '')+
    '</div>';
  } else {
    const isSpec = fam.ui==='spec';
    h += '<div class="cards'+(isSpec?' spec':'')+'">'+shown.map(c=>{
      const C = COMPONENTS[c], blk = !v.avail.has(c);
      return '<button class="opt'+(sel===c?' sel':'')+(blk?' blk':'')+(state.probe===c?' probe':'')+
        '" data-opt="'+c+'" data-fam="'+f+'">'+
        '<span class="on-name">'+esc(C.n)+'</span>'+
        '<span class="on-id">'+c+'</span>'+
        '<span class="flags">'+(C.so==='S'?'<span class="chip s">Default</span>':'<span class="chip">Published</span>')+
          (blk?'<span class="chip blkc">Blocked</span>':'')+'</span>'+
        (isSpec && C.spec ? '<span class="spectab">'+Object.entries(C.spec).map(([k,val])=>
            '<span class="sk">'+esc(k)+'</span><span class="sv">'+esc(val)+'</span>').join('')+'</span>' : '')+
      '</button>';
    }).join('')+'</div>';
  }
  h += '</div>';

  if(state.probe && COMPONENTS[state.probe] && COMPONENTS[state.probe].f===f){
    h += renderExplain(state.probe);
  }
  h += '</div>';
  return h;
}

function renderExplain(cid){
  const info = blockInfo(cid, ev);
  const C = COMPONENTS[cid];
  let h = '<div class="explain">'+
    '<div class="explain-h">'+
      '<span class="ex-t">'+esc(C.n)+' is blocked</span>'+
      (info.rule?'<span class="ex-r">'+info.rule.id+' · '+
        (info.total!=null?(info.total-info.unmet)+' of '+info.total+' conditions met':'scoping rule')+'</span>':'')+
      '<button class="ex-x" data-close-probe="1" title="Close">✕</button>'+
    '</div>';

  if(info.kind==='market'){
    h += '<div class="conds"><div class="cond unmet"><span class="cmark">✕</span><span class="ctext">'+
      esc(info.text)+'<span class="craw">'+esc(info.detail)+'</span></span></div></div>';
  } else {
    if(info.kind==='scope'){
      h += '<div class="conds"><div class="cond unmet"><span class="cmark">✕</span><span class="ctext">'+
        esc(info.text)+'</span></div></div>';
    }
    h += '<div class="conds">'+info.conds.map(c=>
      '<div class="cond '+(c.met?'met':'unmet')+'">'+
        '<span class="cmark">'+(c.met?'✓':'✕')+'</span>'+
        '<span class="ctext">'+c.text+
          '<span class="craw">'+esc(c.raw)+'  ·  now: '+esc(c.now||'—')+'</span>'+
          (c.note?'<span class="craw">'+esc(c.note)+'</span>':'')+
          (c.fix && c.fix.blockedTarget?'<span class="cwarn">The required option '+
            esc(COMPONENTS[c.fix.to].n)+' is itself blocked — applying the fix will step towards it.</span>':'')+
        '</span></div>').join('')+'</div>';

    const fixable = info.conds.filter(c=>!c.met && c.fix);
    const unfixable = info.conds.filter(c=>!c.met && !c.fix);
    h += '<div class="explain-f">';
    if(fixable.length){
      h += '<button class="btn sm primary" data-fix="'+cid+'">Apply '+fixable.length+' change'+
        (fixable.length>1?'s':'')+'</button>';
    }
    h += '<span class="fnote">'+
      (fixable.length
        ? 'Sets '+fixable.map(c=>esc(FAMILIES[c.fix.family].name)+' → '+esc(COMPONENTS[c.fix.to].n)).join(', ')+', then re-evaluates.'
        : '')+
      (unfixable.length
        ? (fixable.length?' ':'')+'Remaining condition'+(unfixable.length>1?'s':'')+
          ' cannot be auto-resolved — adjust the configuration by hand.'
        : '')+
      '</span></div>';
  }
  return h + '</div>';
}
</script>
<script>
/* ==========================  INSPECTOR  ================================= */
const ITABS = [
  {id:'solution', label:'Solution'},
  {id:'mbom',     label:'MBOM'},
  {id:'trace',    label:'Trace'},
  {id:'rules',    label:'Rules'}
];

function renderInspector(){
  const counts = {solution:sbom.reduce((s,x)=>s+x.lines.length,0), mbom:mbom.rows.length,
                  trace:ev.passes.length, rules:SALES_RULES.length+(state.cyclic?CYCLIC_RULES.length:0)};
  let h = '<div class="itabs">'+ITABS.map(t=>
    '<button class="itab'+(state.itab===t.id?' on':'')+'" data-itab="'+t.id+'">'+t.label+
    '<span class="n">'+counts[t.id]+'</span></button>').join('')+'</div>';
  h += '<div class="ibody">'+({solution:iSolution, mbom:iMbom, trace:iTrace, rules:iRules}[state.itab])()+'</div>';
  $('inspector').innerHTML = h;
}

function iSolution(){
  let h = '';
  h += '<div class="isec"><span class="eyebrow">Derived specification</span><div class="deflist">'+
    Object.entries(COMPUTED).map(([k,C])=>
      '<span class="dt">'+esc(C.label)+'</span><span class="dd">'+fmtNum(ev.computed[k])+' '+C.unit+'</span>').join('')+
    '</div><div class="notecard" style="margin-top:7px;color:var(--ink-3)">Computed configurator fields. '+
    'Rules reference them as <code class="mono">--CraneMinFlow</code>.</div></div>';

  for(const s of sbom){
    if(!s.lines.length) continue;
    h += '<div class="isec"><span class="eyebrow">'+esc(s.structure.name)+' · SBOM</span><div class="deflist">'+
      s.lines.map(l=>'<span class="dt">'+esc(l.familyName)+'</span>'+
        '<span class="dd" title="'+esc(l.name)+'">'+l.cid+'</span>').join('')+'</div>'+
      '<div class="notecard" style="margin-top:6px;color:var(--ink-3)">'+
        s.lines.map(l=>esc(l.name)).join(' · ')+'</div></div>';
  }

  const doc = jsonbDoc();
  const pretty = JSON.stringify(doc, null, 2)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/"([^"]+)":/g,'"<span class="jk">$1</span>":')
    .replace(/: "([^"]*)"/g,': "<span class="jv">$1</span>"');
  h += '<div class="isec"><span class="eyebrow">Persisted document</span>'+
    '<div class="notecard" style="margin-bottom:7px">One <code class="mono">JSONB</code> document keyed by UUID, '+
    'auto-saved on every change. Reload the page to restore it.</div>'+
    '<pre class="json">'+pretty+'</pre></div>';
  return h;
}

function iMbom(){
  const acc = mbom.rows.filter(r=>r.from.length>1);
  let h = '<div class="isec"><span class="eyebrow">Manufacturing rule engine</span>'+
    '<div class="notecard">Single pass over <b>'+PROD_RULES.length+'</b> production rules against the stable SBOM — '+
    'no iteration, because rules only ever run SBOM → MBOM. '+
    '<b>'+mbom.rows.length+'</b> material lines, <b>'+mbom.items+'</b> items'+
    (acc.length?', <b>'+acc.length+'</b> with quantities accumulated from more than one rule':'')+'.</div></div>';

  h += '<div class="isec"><div class="tblwrap"><table class="tbl"><thead><tr>'+
    '<th>Material</th><th>Description</th><th class="num">Qty</th></tr></thead><tbody>'+
    mbom.rows.map(r=>'<tr><td class="code">'+r.code+'</td>'+
      '<td>'+esc(r.n)+'<span class="src">'+esc(r.from.join('  +  '))+'</span></td>'+
      '<td class="num'+(r.from.length>1?' sum':'')+'">'+r.q+'</td></tr>').join('')+
    '</tbody></table></div></div>';
  return h;
}

function iTrace(){
  let h = '<div class="isec"><span class="eyebrow">Sales rule cascade</span><div class="notecard">'+
    (ev.stable
      ? 'Stabilised after <b>'+ev.passes.length+'</b> pass'+(ev.passes.length>1?'es':'')+
        ' — the available set and the selections stopped changing. Rule evaluations: <b>'+ev.ruleEvals.toLocaleString('en-GB')+
        '</b> in <b>'+ev.ms.toFixed(1)+' ms</b>.'
      : 'Stopped at the <b>'+MAX_PASSES+'</b>-pass cap without stabilising. Rules whose outcome flipped repeatedly are '+
        'flagged below — that is the cycle.')+
    '</div></div>';

  h += '<div class="isec">'+ev.passes.map((p,i)=>{
    const isCur = state.stepMode && state.stepPass===i+1;
    const osc = !ev.stable && i>=2;
    return '<details class="pass'+(isCur?' cur':'')+(osc?' osc':'')+'"'+(isCur||i===ev.passes.length-1?' open':'')+'>'+
      '<summary><span class="pn">Pass '+p.n+'</span>'+
        '<span class="pchips">'+
          '<span class="pchip">'+p.fired.length+' fired</span>'+
          (p.added.length?'<span class="pchip add">+'+p.added.length+'</span>':'')+
          (p.removed.length?'<span class="pchip rem">−'+p.removed.length+'</span>':'')+
          (p.repairs.length?'<span class="pchip rep">'+p.repairs.length+' repaired</span>':'')+
          '<span class="pchip">'+p.availableCount+' avail</span>'+
        '</span></summary>'+
      '<div class="passbody">'+
        (p.added.length?'<div class="plabel">Became available</div>'+
          p.added.slice(0,14).map(c=>'<div class="dline a"><span class="dm">+</span><span>'+esc(COMPONENTS[c].n)+
            ' <span class="rid">'+c+'</span></span></div>').join('')+
          (p.added.length>14?'<div class="dline a"><span class="dm">+</span><span>… and '+(p.added.length-14)+' more</span></div>':''):'')+
        (p.removed.length?'<div class="plabel">Withdrawn</div>'+
          p.removed.slice(0,10).map(c=>'<div class="dline r"><span class="dm">−</span><span>'+esc(COMPONENTS[c].n)+
            ' <span class="rid">'+c+'</span></span></div>').join(''):'')+
        (p.repairs.length?'<div class="plabel">Selections repaired</div>'+
          p.repairs.map(r=>'<div class="dline p"><span class="dm">→</span><span>'+
            esc(FAMILIES[r.family].name)+': '+(r.from?esc(COMPONENTS[r.from].n):'—')+' → '+
            (r.to?esc(COMPONENTS[r.to].n):'cleared')+' <span class="rid">'+esc(r.why)+'</span></span></div>').join(''):'')+
        '<div class="plabel">Rules that fired</div><div class="firedlist">'+
          p.fired.map(id=>'<span class="fr'+(ev.culprits.includes(id)?' cyc':'')+'">'+id+'</span>').join('')+
        '</div>'+
      '</div></details>';
  }).join('')+'</div>';
  return h;
}

function iRules(){
  const all = SALES_RULES.concat(state.cyclic?CYCLIC_RULES:[]);
  const q = state.ruleFilter.trim().toLowerCase();
  const list = all.filter(r=> !q ||
    r.id.toLowerCase().includes(q) || r.t.id.toLowerCase().includes(q) ||
    r.c.join(' ').toLowerCase().includes(q) ||
    (COMPONENTS[r.t.id] && COMPONENTS[r.t.id].n.toLowerCase().includes(q)));

  let h = '<div class="isec"><span class="eyebrow">Condition grammar</span><div class="grammar">'+
    '<code>F..==C1|C2</code><span class="g-d">Family F selects C1 or C2. Pipes are OR within a column; columns are AND.</span>'+
    '<code>F..&lt;&gt;C1</code><span class="g-d">Family F is anything but C1.</span>'+
    '<code>F..&gt;=4500</code><span class="g-d">Comparison on the selected option’s numeric attribute.</span>'+
    '<code>F..==Blank</code><span class="g-d">Family F has no current selection.</span>'+
    '<code>F..~=Fit</code><span class="g-d">Shared-attribute matching against the selection in F.</span>'+
    '<code>Attr..==V</code><span class="g-d">Attribute condition, resolved on the candidate or a selected option.</span>'+
    '<code>A..&gt;=--B</code><span class="g-d">Cross-field comparison against a computed configurator field.</span>'+
    '</div>'+
    '<div class="callout" style="margin-top:9px"><b>Assumption 2 in the architecture document.</b> '+
    'The cross-field form (<code class="mono">PumpFlow..&gt;=--CraneMinFlow</code> in <code class="mono">R-IA-020/021/022</code>) '+
    'is interpreted here as: the candidate option’s own attribute compared against a computed field. '+
    'That is one reading of Appendix 4 and the one construct we want to confirm in week-one knowledge transfer.</div></div>';

  h += '<div class="isec"><span class="eyebrow">Sales rules · '+list.length+' of '+all.length+'</span>'+
    '<input class="rulesearch" id="rulesearch" placeholder="Filter by rule, option or condition…" value="'+
      esc(state.ruleFilter)+'" style="margin-bottom:8px">'+
    list.map(r=>{
      const cand = r.t.k==='component' ? r.t.id : null;
      const cs = r.c.map(raw=>({raw, met:evalCond(raw, ev.ctx, cand)}));
      const fires = cs.every(c=>c.met);
      const cyc = ev.culprits.includes(r.id);
      const tname = r.t.k==='component' ? COMPONENTS[r.t.id].n
                  : r.t.k==='family' ? FAMILIES[r.t.id].name
                  : GROUPS[r.t.id].name;
      return '<div class="rule'+(fires?' fires':'')+(cyc?' cycflag':'')+'">'+
        '<div class="rule-h"><span class="rid2">'+r.id+'</span>'+
          '<span class="rst '+(fires?'y':'n')+'">'+(fires?'fires':'no match')+'</span></div>'+
        '<div class="rimp">→ <b>'+esc(tname)+'</b> <span class="mono" style="font-size:10.5px;color:var(--ink-3)">'+
          r.t.id+'</span>'+(r.t.k!=='component'?'<span class="lv">'+r.t.k+'-level</span>':'')+'</div>'+
        '<div class="rconds">'+cs.map(c=>'<div class="rc '+(c.met?'y':'n')+'">'+
          '<span class="m">'+(c.met?'✓':'✕')+'</span><span class="x">'+esc(c.raw)+'</span></div>').join('')+'</div>'+
      '</div>';
    }).join('')+'</div>';
  return h;
}

/* ==========================  RENDER + EVENTS  =========================== */
function render(){
  $('m-model').textContent = MODEL;
  $('m-cfgid').textContent = state.configId.slice(0,8)+'…'+state.configId.slice(-4);
  $('m-cfgid').title = state.configId;
  $('m-saved').textContent = state.savedAt
    ? 'saved ' + state.savedAt.toLocaleTimeString('en-GB') : '—';
  renderTelemetry(); renderRail(); renderMain(); renderInspector();
}

function setMarketOptions(){
  $('marketsel').innerHTML = MARKETS.map(m=>
    '<option value="'+m.id+'"'+(state.market===m.id?' selected':'')+'>'+m.id+' — '+m.name+'</option>').join('');
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-struct],[data-group],[data-opt],[data-dd],[data-policy],[data-cyclic],[data-itab],[data-fix],[data-close-probe],#btn-new,#btn-step,#btn-prev,#btn-next,#btn-resume,#btn-prev2,#btn-next2,#btn-resume2');
  if(!t){ if(state.openDd){ state.openDd = null; render(); } return; }

  if(t.dataset.struct){ state.structure = t.dataset.struct; state.probe = null; state.openDd = null; return render(); }
  if(t.dataset.group){ state.group = t.dataset.group; state.probe = null; state.openDd = null; return render(); }
  if(t.dataset.itab){ state.itab = t.dataset.itab; return render(); }
  if(t.dataset.policy){ state.policy = t.dataset.policy; state.probe = null; save(); return render(); }
  if(t.dataset.closeProbe){ state.probe = null; return render(); }

  if(t.dataset.cyclic!==undefined && t.dataset.cyclic){
    state.cyclic = !state.cyclic;
    state.stepMode = false; state.probe = null;
    return run({announceRepairs:true});
  }
  if(t.dataset.dd){
    state.openDd = state.openDd===t.dataset.dd ? null : t.dataset.dd;
    return render();
  }
  if(t.dataset.opt){
    const cid = t.dataset.opt, fam = t.dataset.fam;
    state.openDd = null;
    if(state.stepMode) return;
    const v = view();
    const blocked = !v.avail.has(cid);
    if(blocked && state.policy!=='explain'){
      state.probe = state.probe===cid ? null : cid;
      return render();
    }
    if(blocked && state.policy==='explain'){
      state.probe = cid;
      return render();
    }
    state.selection[fam] = cid;
    state.probe = null;
    return run({announceRepairs:true, changedFamily:fam});
  }
  if(t.dataset.fix){
    const info = blockInfo(t.dataset.fix, ev);
    const fixes = (info.conds||[]).filter(c=>!c.met && c.fix);
    fixes.forEach(c=>{ state.selection[c.fix.family] = c.fix.to; });
    const still = t.dataset.fix;
    run({announceRepairs:true});
    if(!ev.avail.has(still)){ state.probe = still; render(); }
    else { toast('Unblocked', '<code>'+esc(COMPONENTS[still].n)+'</code> is now available.'); state.probe = null; render(); }
    return;
  }
  switch(t.id){
    case 'btn-new':
      state.configId = newId(); state.selection = {}; state.probe = null;
      state.stepMode = false; state.cyclic = false;
      toast('New configuration', 'Fresh UUID. Market defaults re-seeded by the engine.');
      return run({});
    case 'btn-step':   state.stepMode = true; state.stepPass = 1; state.probe = null; return render();
    case 'btn-prev': case 'btn-prev2': state.stepPass = Math.max(1, state.stepPass-1); return render();
    case 'btn-next': case 'btn-next2': state.stepPass = Math.min(ev.passes.length, state.stepPass+1); return render();
    case 'btn-resume': case 'btn-resume2':
      state.stepMode = false; state.stepPass = ev.passes.length; return render();
  }
});

document.addEventListener('input', e=>{
  if(e.target.id==='rulesearch'){
    state.ruleFilter = e.target.value;
    const el = e.target, pos = el.selectionStart;
    renderInspector();
    const n = $('rulesearch');
    if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} }
  }
});

document.addEventListener('change', e=>{
  if(e.target.id==='marketsel'){
    state.market = e.target.value;
    state.probe = null; state.stepMode = false;
    toast('Market changed to '+state.market,
      'The model publication service re-scoped the solution space. Options not published in this market are withdrawn.');
    run({announceRepairs:true});
  }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(state.openDd){ state.openDd = null; render(); }
    else if(state.probe){ state.probe = null; render(); }
  }
});

/* ---- boot -------------------------------------------------------------- */
load();
setMarketOptions();
run({});
</script>
